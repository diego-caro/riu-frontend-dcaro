<div class="top-container">
  <h2>Heroes</h2>
  <div class="search-container">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-input">
      <mat-label>Search</mat-label>
      <input matInput [formControl]="searchControl" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <button mat-flat-button color="primary" (click)="onAdd()">
      <mat-icon>add</mat-icon> New Hero
    </button>
  </div>
</div>
<div class="bottom-container">
  @if (dataSource.data.length === 0) {
  <div class="no-data">
    Not found heroes.
  </div>
  } @else {
  <div class="table-data">
    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef class="column-data">Name</th>
        <td mat-cell *matCellDef="let hero">{{ hero.name }}</td>
      </ng-container>

      <ng-container matColumnDef="power">
        <th mat-header-cell *matHeaderCellDef class="column-data">Power</th>
        <td mat-cell *matCellDef="let hero">{{ hero.power }}</td>
      </ng-container>

      <ng-container matColumnDef="secretIdentity">
        <th mat-header-cell *matHeaderCellDef class="column-data">Secret Identity</th>
        <td mat-cell *matCellDef="let hero">{{ hero.secretIdentity }}</td>
      </ng-container>

      <ng-container matColumnDef="weakness">
        <th mat-header-cell *matHeaderCellDef class="column-data">Weakness</th>
        <td mat-cell *matCellDef="let hero">{{ hero.weakness }}</td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef class="column-data">State</th>
        <td mat-cell *matCellDef="let hero"><span class="status-badge" [class.active]="hero.isActive">{{hero.isActive ?
            'Active' : 'Inactive' }}</span></td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="column-data">Actions</th>
        <td mat-cell *matCellDef="let hero">
          <button mat-icon-button (click)="onEdit(hero)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button (click)="onDelete(hero)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
  }
</div>
@if (dataSource.data.length !== 0) {
<mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
}
