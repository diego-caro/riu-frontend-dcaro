<div class="top-container">
  <h1>Heroes</h1>
  <mat-form-field>
    <mat-label>Search</mat-label>
    <input matInput [formControl]="searchControl" />
  </mat-form-field>
  <button mat-raised-button color="primary" (click)="onAdd()">
    <mat-icon>add</mat-icon> New Hero
  </button>
</div>
<div class="bottom-container">
  <table mat-table [dataSource]="dataSource">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let hero">{{ hero.name }}</td>
    </ng-container>

    <ng-container matColumnDef="power">
      <th mat-header-cell *matHeaderCellDef>Power</th>
      <td mat-cell *matCellDef="let hero">{{ hero.power }}</td>
    </ng-container>

    <ng-container matColumnDef="secretIdentity">
      <th mat-header-cell *matHeaderCellDef>Secret Identity</th>
      <td mat-cell *matCellDef="let hero">{{ hero.secretIdentity }}</td>
    </ng-container>

    <ng-container matColumnDef="weakness">
      <th mat-header-cell *matHeaderCellDef>Weakness</th>
      <td mat-cell *matCellDef="let hero">{{ hero.weakness }}</td>
    </ng-container>

    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef>State</th>
      <td mat-cell *matCellDef="let hero">{{ hero.isActive ? 'Active' : 'Inactive' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let hero">
        <button mat-icon-button (click)="onEdit(hero)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button (click)="onDelete(hero)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
